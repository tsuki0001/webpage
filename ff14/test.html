<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>背景にランダム画像</title>
  <style>
.sidebar {
  flex: 1;
  padding: 20px;
  background-color: #f9fafb;
  border-radius: 12px;
}

.card {
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.05);
  padding: 15px 20px;
  margin-bottom: 20px;
}

.card h3 {
  margin-top: 0;
  font-size: 1.1rem;
  color: #374151;
  border-bottom: 1px solid #e5e7eb;
  padding-bottom: 5px;
  margin-bottom: 10px;
}

.card ul {
  list-style: none;
  padding: 0;
}

.card ul li a {
  color: #3b82f6;
  text-decoration: none;
}

.card ul li a:hover {
  text-decoration: underline;
}

.avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  margin: 10px 0;
}

.search-box {
  width: 100%;
  padding: 8px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: 0.95rem;
}

.social-links a {
  color: #1e40af;
  text-decoration: none;
  font-size: 0.95rem;
}

.social-links a:hover {
  text-decoration: underline;
}


    body {
      margin: 0;
      padding: 0;
      background-color: #fdfdfd;
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    .bg-icon {
      position: absolute;
      transform: rotate(-15deg);
      width: 20%;
      height: 20%;
      opacity: 0.2;
    }

    .bg1 { top: 10%; left: 20%; }
    .bg2 { top: 40%; left: 60%; }
    .bg3 { top: 70%; left: 10%; }
    .bg4 { top: 30%; left: 80%; }
  </style>
</head>
<body>

  <!-- 背景アイコン -->
  <img src="./image/cool_vert.JPG" class="bg-icon bg1" />
  <img src="./image/cool_vert.JPG" class="bg-icon bg2" />
  <img src="./image/cool_vert.JPG" class="bg-icon bg3" />
  <img src="./image/cool_vert.JPG" class="bg-icon bg4" />

  <h1 style="position: relative; z-index: 1; text-align: center; padding-top: 100px;">
    背景に画像がちらほら
  </h1>

  <aside class="sidebar">
    <div class="card">
      <h3>プロフィール</h3>
      <img src="https://i.imgur.com/0y0y0y0.png" alt="プロフィール画像" class="avatar">
      <p>こんにちは！Webと語学が好きな開発者です。</p>
    </div>
  
    <div class="card">
      <h3>検索</h3>
      <input type="text" placeholder="キーワード検索" class="search-box">
    </div>
  
    <div class="card">
      <h3>人気記事</h3>
      <ul>
        <li><a href="#">英単語の覚え方ベスト5</a></li>
        <li><a href="#">VSCodeの神設定まとめ</a></li>
      </ul>
    </div>
  
    <div class="card">
      <h3>カテゴリ</h3>
      <ul>
        <li><a href="#">HTML</a></li>
        <li><a href="#">JavaScript</a></li>
        <li><a href="#">英語学習</a></li>
      </ul>
    </div>
  
    <div class="card">
      <h3>フォローする</h3>
      <div class="social-links">
        <a href="#">🐦 Twitter</a><br>
        <a href="#">📘 Facebook</a>
      </div>
    </div>
  </aside>

</body>
</html>
